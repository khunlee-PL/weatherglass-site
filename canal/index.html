<meta charset="utf-8" />
<title>Thailand Water Watch</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<style>
  /* Layout: full-bleed map + floating top rail, clickable legend (bottom-left), slide-in "near me" panel (right). */
  :root{
    --bg:#eef1f4; --surface:#ffffff; --surface-2:#f4f7f9; --fg:#182430; --muted:#5a6a79;
    --line:#dde3ea; --accent:#0e7aa6; --accent-ink:#ffffff;
    --normal:#24b295; --alert:#f4b05b; --critical:#e85965; --oos:#676b6b; --oostmp:#829c99;
    --shadow:0 6px 24px rgba(20,40,60,.16); --shadow-sm:0 2px 8px rgba(20,40,60,.12);
    font-family:"IBM Plex Sans","Noto Sans Thai",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0e161d; --surface:#16222c; --surface-2:#1d2c37; --fg:#e7edf2; --muted:#9fb0be;
    --line:#263742; --accent:#3aa9d4; --accent-ink:#04222f;
    --shadow:0 8px 28px rgba(0,0,0,.5); --shadow-sm:0 2px 10px rgba(0,0,0,.4); color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0e161d; --surface:#16222c; --surface-2:#1d2c37; --fg:#e7edf2; --muted:#9fb0be;
    --line:#263742; --accent:#3aa9d4; --accent-ink:#04222f;
    --shadow:0 8px 28px rgba(0,0,0,.5); --shadow-sm:0 2px 10px rgba(0,0,0,.4); color-scheme:dark;
  }
  *,*::before,*::after{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden}
  #map{position:absolute;inset:0}
  .lang-th{font-family:"Noto Sans Thai","IBM Plex Sans",sans-serif}

  #rail{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;align-items:flex-start;flex-wrap:wrap;gap:8px;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 12px;
    background:linear-gradient(var(--bg),color-mix(in srgb,var(--bg) 55%,transparent) 78%,transparent);pointer-events:none}
  #rail > *{pointer-events:auto}
  .brand{display:flex;flex-direction:column;align-items:flex-start;gap:4px;margin-right:auto;min-width:0}
  .logo{display:inline-flex;background:#fff;border-radius:9px;padding:5px 10px;box-shadow:var(--shadow-sm);line-height:0}
  .logo svg{height:54px;width:auto;display:block}
  .credit{font-size:12.5px;font-weight:600;color:var(--accent);max-width:100%;line-height:1.35}
  .credit a{color:var(--accent);text-decoration:none}
  .credit a:hover{text-decoration:underline}
  .credit .sep{color:var(--muted);font-weight:500;margin:0 3px}
  .stamp{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;max-width:100%}
  .langwrap{display:flex;flex-direction:column;align-items:center;gap:4px}
  .copyr{font-size:9.5px;color:var(--muted);white-space:nowrap;letter-spacing:.1px}
  .searchwrap{position:relative;display:flex;align-items:center;gap:6px;height:38px;padding:0 11px;border:1px solid var(--line);
    background:var(--surface);border-radius:10px;box-shadow:var(--shadow-sm)}
  .searchwrap > svg{width:15px;height:15px;color:var(--muted);flex:none}
  .searchwrap input{border:0;background:transparent;color:var(--fg);font:inherit;font-size:13px;outline:none;width:160px;min-width:0}
  #searchResults{position:absolute;top:44px;left:0;min-width:260px;max-width:min(360px,90vw);background:var(--surface);
    border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden auto;z-index:20;max-height:280px}
  #searchResults .sr{padding:9px 12px;font-size:12.5px;line-height:1.35;cursor:pointer;border-bottom:1px solid var(--line)}
  #searchResults .sr:last-child{border-bottom:0}
  #searchResults .sr:hover{background:var(--surface-2)}
  #searchResults .sr.muted{color:var(--muted);cursor:default}
  .btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border:1px solid var(--line);
    background:var(--surface);color:var(--fg);border-radius:10px;font:inherit;font-size:13px;font-weight:600;
    cursor:pointer;box-shadow:var(--shadow-sm);white-space:nowrap}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .btn svg{width:16px;height:16px;flex:none}
  .btn.icon{padding:0;width:38px;justify-content:center}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-sm)}
  .seg button{border:0;background:var(--surface);color:var(--muted);font:inherit;font-weight:600;font-size:13px;padding:0 12px;height:38px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

  #legend{position:absolute;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:4;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:11px 12px;max-width:230px}
  #legend h4{margin:0 0 7px;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .lgrid{display:grid;grid-template-columns:1fr}
  .lg{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:3px 0;padding:3px 4px;border-radius:7px;cursor:pointer;user-select:none}
  .lg:hover{background:var(--surface-2)}
  .lg.off{opacity:.4}
  .lg .dot{width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid rgba(255,255,255,.7)}
  .lg .ct{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px;font-weight:600}
  #legend .skey{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  #legend .sk{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--muted)}
  #legend .km{width:11px;height:11px;flex:none;background:var(--muted)}
  #legend .km.circ{border-radius:50%}
  #legend .km.sq{border-radius:2px}
  #legend .km.tri{background:transparent;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid var(--muted)}
  #legend .foot{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.4}

  #sheet{position:absolute;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:6;width:334px;max-width:calc(100vw - 28px);
    background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;max-height:min(62vh,470px);overflow:hidden}
  #sheet header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
  #sheet header b{font-size:14px}
  #sheet header .sub{font-size:11.5px;color:var(--muted);margin-top:2px}
  #sheet .close{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:2px 4px}
  #near{overflow-y:auto;padding:6px}
  .row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
  .row:hover{background:var(--surface-2)}
  .row .sv{width:11px;height:11px;border-radius:50%;flex:none;align-self:flex-start;margin-top:3px}
  .row .mid{min-width:0;flex:1}
  .row .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .meta{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .rt{text-align:right;flex:none}
  .row .lvl{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
  .row .st{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
  .empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5}

  .maplibregl-popup-content{background:var(--surface);color:var(--fg);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-family:inherit;border:1px solid var(--line)}
  .maplibregl-popup-close-button{color:var(--muted);font-size:18px;padding:2px 6px}
  .maplibregl-popup-tip{border-top-color:var(--surface)!important;border-bottom-color:var(--surface)!important}
  .pp .ppn{font-size:14px;font-weight:700;line-height:1.25;padding-right:14px}
  .pp .ppsub{font-size:11.5px;color:var(--muted);margin-top:2px}
  .pp .pprow{display:flex;align-items:baseline;gap:8px;margin-top:10px}
  .pp .ppv{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .pp .ppu{font-size:11px;color:var(--muted)}
  .pp .ppth{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.5}
  .chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;color:#fff}

  #modal{position:absolute;inset:0;z-index:20;background:color-mix(in srgb,#000 50%,transparent);display:flex;align-items:center;justify-content:center;padding:20px}
  #modal .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);max-width:470px;width:100%;max-height:82vh;overflow-y:auto;padding:22px}
  #modal h2{margin:0 0 4px;font-size:18px}
  #modal p{color:var(--muted);font-size:13px;line-height:1.6;margin:10px 0}
  #modal code{background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:12px}
  #modal .card .btn{margin-top:6px}
  #modal a{color:var(--accent)}
  .maplibregl-ctrl-group{border-radius:10px!important;box-shadow:var(--shadow-sm)!important}

  @keyframes spin{to{transform:rotate(360deg)}}
  .btn.icon.spin svg{animation:spin .9s linear infinite}
  #toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);z-index:30;
    background:var(--fg);color:var(--bg);padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:600;
    box-shadow:var(--shadow);opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100vw - 28px)}
  #toast.show{opacity:.96}
  @media (prefers-reduced-motion:reduce){.btn.icon.spin svg{animation:none}}

  @media (max-width:620px){
    .stamp{display:none}
    .logo svg{height:44px}
    .credit{font-size:11.5px}
    #sheet{left:14px;width:auto}
    #legend{max-width:min(94vw,300px);padding:9px 10px}
    #legend h4{margin-bottom:5px}
    .lgrid{grid-template-columns:1fr 1fr;column-gap:10px}
    #legend .lg{margin:1px 0;font-size:11.5px;padding:2px 3px;align-items:flex-start}
    #legend .lg span:not(.dot):not(.ct){white-space:normal;line-height:1.15}
    #legend .lg .dot{margin-top:2px}
    #legend .lg .ct{font-size:11px}
    .btn .lbl{display:none}
    .btn.locate .lbl,.btn#allBtn .lbl,.btn#pinBtn .lbl{display:inline}
  }
  .pinname{width:100%;box-sizing:border-box;font:inherit;font-size:14px;font-weight:700;color:var(--fg);
    background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;outline:none}
  .pinname:focus{border-color:var(--accent)}
  .dammk{width:20px;height:20px;border-radius:3px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);
    cursor:pointer;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  .dammk svg{width:13px;height:13px;display:block}
  .pinmk{width:28px;height:28px;color:var(--accent);cursor:pointer;line-height:0}
  .pinmk svg{width:28px;height:28px;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
</style>

function popupHTML(f){
  const p=f.properties,t=I18N[lang],s=statusOf(p),primary=lang==="th"?p.th:(p.en||p.th);

    const dl=(p.diff!=null&&p.difftxt)?`${p.difftxt} ${Math.abs(+p.diff).toFixed(2)} ${t.unit}`:"";
    const th=[dl,bank].filter(Boolean).join(" · ");

      <div class="pprow">${val}<span class="chip" style="background:${s.col};margin-left:auto">${stLabel(p)}</span></div>${th?`<div class="ppth">${th}</div>`:""}</div>`;
  }
  const second=lang==="th"?(p.en||""):(p.th||"");
  const sub=[second,(lang==="th"?p.dt:p.de)].filter(Boolean).join(" · ");
  if(p.r!==1){
    return `<div class="pp ${lang==='th'?'lang-th':''}"><div class="ppn">${primary}</div>${sub?`<div class="ppsub">${sub}</div>`:""}
      <div class="ppth">${t.notchecked}</div></div>`;
  }
  const parts=[];
  if(p.wn!=null)parts.push(`${t.warn} ${(+p.wn).toFixed(2)}`);
  if(p.cr!=null)parts.push(`${t.crit} ${(+p.cr).toFixed(2)}`);

  if(p.rb!=null)parts.push(`${t.right} ${(+p.rb).toFixed(2)}`);
  const th=parts.length?`<div class="ppth">${t.banks}: ${parts.join(" · ")} ${t.unit}</div>`:"";
  const val=(p.wl!=null)?`<span class="ppv" style="color:${s.col}">${(+p.wl).toFixed(2)}</span><span class="ppu">${t.unit}</span>`:`<span class="ppu">—</span>`;

    <div class="pprow">${val}<span class="chip" style="background:${s.col};margin-left:auto">${stLabel(p)}</span></div>${th}</div>`;
}

function haversine(a,b){const R=6371,dLat=(b[1]-a[1])*Math.PI/180,dLon=(b[0]-a[0])*Math.PI/180,la1=a[1]*Math.PI/180,la2=b[1]*Math.PI/180;
  const h=Math.sin(dLat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
function fmtDist(km){return km<1?Math.round(km*1000)+" m":km.toFixed(km<10?1:0)+" km";}

function fitToNearby(loc,n){
  const near=STATIONS.features.map(f=>({f,d:haversine(loc,f.geometry.coordinates)})).sort((a,b)=>a.d-b.d).slice(0,n||6);

function featsBKK(arr){             // BMA canals → unified features
  const feats=[];
  arr.forEach(x=>{
    if(x.latitude==null||x.longitude==null)return;
    const id="bkk_"+x.water_id;
    feats.push({type:"Feature",id,geometry:{type:"Point",coordinates:[+x.longitude,+x.latitude]},
      properties:{id,src:"bkk",sit:bkkSit(x.txtStatus_en),th:x.water_shortname||x.water_name,en:x.water_shortname_en||x.water_name_en,
        dt:x.district_name,de:x.district_name_en,rv:x.river_name,wl:x.wl_in,lb:x.left_bank,rb:x.right_bank,
        wn:x.warning,cr:x.critical,sth:x.txtStatus,sen:x.txtStatus_en,r:0}});
  });
  return feats;
}
function featsCP(arr){              // HII river gauges (Chao Phraya basins) → unified features
  const feats=[];
  arr.forEach(x=>{const st=x.station||{};if(st.tele_station_lat==null)return;
    const b=x.basin&&x.basin.basin_name?x.basin.basin_name.th:"";if(!CP_BASINS.has(b))return;
    const id="cp_"+st.id, nm=(st.tele_station_name&&st.tele_station_name.th)?st.tele_station_name.th:(st.tele_station_oldcode||"");
    feats.push({type:"Feature",id,geometry:{type:"Point",coordinates:[+st.tele_station_long,+st.tele_station_lat]},
      properties:{id,src:"cp",sit:cpSit(x.situation_level),th:nm,en:nm,code:st.tele_station_oldcode||"",river:x.river_name||"",
        pvt:x.geocode&&x.geocode.province_name?x.geocode.province_name.th:"",pve:x.geocode&&x.geocode.province_name?x.geocode.province_name.en:"",
        wl:(x.waterlevel_msl!=null?+x.waterlevel_msl:null),lb:(st.left_bank!=null?+st.left_bank:null),rb:(st.right_bank!=null?+st.right_bank:null),
        diff:(x.diff_wl_bank!=null?+x.diff_wl_bank:null),difftxt:x.diff_wl_bank_text||"",r:0}});
  });
  return feats;
}
async function pullLive(){
  const [bkk,cp]=await Promise.allSettled([
    fetch(PROXY_BKK,{cache:"no-store"}).then(r=>r.json()),
    fetch(HII_WL,{cache:"no-store"}).then(r=>r.json())
  ]);
  let feats=[];
  if(bkk.status==="fulfilled"){const j=bkk.value;const a=Array.isArray(j)?j:(j&&j.stations);if(Array.isArray(a))feats=feats.concat(featsBKK(a));}
  if(cp.status==="fulfilled"){const a=cp.value&&cp.value.waterlevel_data&&cp.value.waterlevel_data.data;
    if(Array.isArray(a))feats=feats.concat(featsCP(a));
    const dt=(a&&(a.find(x=>x.waterlevel_datetime)||{}).waterlevel_datetime)||"";
    if(dt)CAPTURED=dt.replace(" ","T");
  }
  if(!feats.length)throw new Error("no data");
  STATIONS.features=feats; byId={}; feats.forEach(f=>byId[f.id]=f);
  isLive=true; updatedAt=new Date(CAPTURED||Date.now());
  pullDams().catch(()=>{});
  return true;
}

const damMarkers=[];
function clearDams(){damMarkers.forEach(m=>m.remove());damMarkers.length=0;}
async function pullDams(){
  const j=await (await fetch(HII_DAM,{cache:"no-store"})).json();
  const g=j.data||{}, all=[...(g.dam_hourly||[]),...(g.dam_daily||[]),...(g.dam_medium||[])], byDam={};
  all.forEach(x=>{const D=x.dam;if(!D||D.dam_lat==null)return;const b=x.basin&&x.basin.basin_name?x.basin.basin_name.th:"";if(!CP_BASINS.has(b))return;
    const rec={id:D.id,th:D.dam_name.th,en:D.dam_name.en,lat:+D.dam_lat,lng:+D.dam_long,
      pct:(x.dam_storage_percent!=null?+x.dam_storage_percent:null),inflow:x.dam_inflow,released:x.dam_released,level:x.dam_level,date:x.dam_date};
    const cur=byDam[D.id];
    if(!cur||(rec.pct>0&&(cur.pct==null||cur.pct===0))||(new Date(rec.date)>new Date(cur.date))) byDam[D.id]=rec;
  });
  clearDams();Object.values(byDam).forEach(addDamMarker);
}
function addDamMarker(d){
  const el=document.createElement("div");el.className="dammk";el.style.background=damColor(d.pct);
  el.innerHTML='<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 3h3v18H4zM7 7h13v3H7zM7 13h13v3H7z"/></svg>';
  const m=new maplibregl.Marker({element:el,anchor:"center"}).setLngLat([d.lng,d.lat]).addTo(map);
  el.addEventListener("click",ev=>{ev.stopPropagation();openDamPopup(d);});
  damMarkers.push(m);
}
function openDamPopup(d){

      <div class="pprow"><span class="ppv" style="color:${damColor(d.pct)}">${d.pct!=null?d.pct+"%":"—"}</span><span class="ppu">${t.storage}</span></div>
      <div class="ppth">${t.inflow}: ${d.inflow!=null?d.inflow:"-"} · ${t.release}: ${d.released!=null?d.released:"-"} ${t.mcm}</div></div>`).addTo(map);
  popup._f=null;
}
function commit(){
  if(!updatedAt)updatedAt=new Date(CAPTURED);
  if(map.getSource("st"))map.getSource("st").setData(STATIONS);
  applyFilter();renderLegend();renderNear();updateStamp();
  if(popup&&popup._f)popup.setHTML(popupHTML(popup._f));
}
function revealNearest(n){
  if(!userLoc)return;
  const sorted=STATIONS.features.map(f=>({f,d:haversine(userLoc,f.geometry.coordinates)})).sort((a,b)=>a.d-b.d);
  revealed.clear();STATIONS.features.forEach(f=>f.properties.r=0);
  sorted.slice(0,n).forEach(({f})=>{f.properties.r=1;revealed.add(f.id);});
  commit();
}
function revealAll(){
  revealed.clear();STATIONS.features.forEach(f=>{f.properties.r=1;revealed.add(f.id);});
  commit();
}

}

function makeTriangleIcon(){
  const s=26,c=document.createElement("canvas");c.width=c.height=s;const g=c.getContext("2d");
  g.beginPath();g.moveTo(s/2,3);g.lineTo(s-3,s-4);g.lineTo(3,s-4);g.closePath();g.fillStyle="#fff";g.fill();
  return {width:s,height:s,data:g.getImageData(0,0,s,s).data};
}

      paint:{"text-color":"#1a5fb4","text-halo-color":"#ffffff","text-halo-width":1.6}});
  }
  map.addSource("st",{type:"geojson",data:STATIONS});
  // BMA canals — circular dots
  map.addLayer({id:"st-c",type:"circle",source:"st",filter:["==",["get","src"],"bkk"],
    layout:{"circle-sort-key":["case",["==",["get","r"],1],1,0]},
    paint:{
      "circle-radius":["interpolate",["linear"],["zoom"],9,["case",["==",["get","r"],1],4,3],12,["case",["==",["get","r"],1],6.5,4.5],15,["case",["==",["get","r"],1],10,7]],
      "circle-color":["case",["==",["get","r"],1],COLOR_EXPR,BLANK],
      "circle-stroke-width":["case",["==",["get","r"],1],1.6,1],"circle-stroke-color":"#ffffff",
      "circle-opacity":["case",["==",["get","r"],1],.95,.5]
    }});
  // HII river gauges — triangles
  map.addLayer({id:"st-t",type:"symbol",source:"st",filter:["==",["get","src"],"cp"],
    layout:{"icon-image":"tri","icon-allow-overlap":true,"icon-ignore-placement":true,
      "symbol-sort-key":["case",["==",["get","r"],1],0,1],
      "icon-size":["interpolate",["linear"],["zoom"],6,0.45,10,0.72,14,1.05]},
    paint:{"icon-color":["case",["==",["get","r"],1],COLOR_EXPR,BLANK],
      "icon-halo-color":"#ffffff","icon-halo-width":1.3,
      "icon-opacity":["case",["==",["get","r"],1],.98,.55]}});
  ["st-c","st-t"].forEach(L=>{
    map.on("click",L,e=>{if(placeMode||pinMode)return;openStation(e.features[0]);});
    map.on("mouseenter",L,()=>{if(!placeMode&&!pinMode)map.getCanvas().style.cursor="pointer";});
    map.on("mouseleave",L,()=>{if(!placeMode&&!pinMode)map.getCanvas().style.cursor="";});
  });
  applyFilter();
  withLive(revealAll);   // load BMA + HII live, show all
  renderPins();          // restore saved pins
});
map.on("click",e=>{
  if(map.queryRenderedFeatures(e.point,{layers:[...(map.getLayer("st-c")?["st-c"]:[]),...(map.getLayer("st-t")?["st-t"]:[])]}).length)return; // station handled above
  if(pinMode){addPin(e.lngLat.lng,e.lngLat.lat);pinMode=false;map.getCanvas().style.cursor="";return;}
  if(placeMode){setUser(e.lngLat.lng,e.lngLat.lat,false);placeMode=false;map.getCanvas().style.cursor="";return;}
});
geo.on("geolocate",e=>{placeMode=false;map.getCanvas().style.cursor="";const fit=wantFit;wantFit=false;setUser(e.coords.longitude,e.coords.latitude,fit);});
geo.on("error",()=>{toast(I18N[lang].denied+" · "+I18N[lang].setman);placeMode=true;map.getCanvas().style.cursor="crosshair";});
window.__place=()=>{placeMode=true;map.getCanvas().style.cursor="crosshair";};

async function withLive(fn){
  const btn=document.getElementById("refreshBtn");btn.classList.add("spin");
  try{ await pullLive(); }catch(e){ toast(I18N[lang].reffail); }
  finally{ btn.classList.remove("spin"); }
  fn();
}
async function setUser(lng,lat,fly){
  userLoc=[lng,lat];
  if(!userMarker){const el=document.createElement("div");
    el.style.cssText="width:18px;height:18px;border-radius:50%;background:#2c7be5;border:3px solid #fff;box-shadow:0 0 0 2px rgba(44,123,229,.5)";
    userMarker=new maplibregl.Marker({element:el}).setLngLat(userLoc).addTo(map);}
  else userMarker.setLngLat(userLoc);
  if(!revealed.size)revealAll();     // ensure stations are shown
  if(fly)fitToNearby(userLoc,6);     // frame you + nearest stations — only when explicitly asked
}

// ── saved pins (localStorage) ──────────────────────────────────────────
function addPinMarker(p){
  const el=document.createElement("div");el.className="pinmk";
  el.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" stroke="#fff" stroke-width="1.5"><path d="M12 22s7-6.6 7-12a7 7 0 1 0-14 0c0 5.4 7 12 7 12z"/><circle cx="12" cy="10" r="2.6" fill="#fff" stroke="none"/></svg>';
  const m=new maplibregl.Marker({element:el,anchor:"bottom",draggable:true}).setLngLat([p.lng,p.lat]).addTo(map);
  let dragged=false;
  m.on("dragstart",()=>{dragged=true;if(popup)popup.remove();});
  m.on("dragend",()=>{const ll=m.getLngLat();p.lng=+ll.lng.toFixed(5);p.lat=+ll.lat.toFixed(5);savePins();selectPin(p);openPinPopup(p);setTimeout(()=>dragged=false,50);});
  el.addEventListener("click",ev=>{ev.stopPropagation();if(dragged)return;selectPin(p);openPinPopup(p);});
  pinMarkers[p.id]=m;
}
function renderPins(){for(const k in pinMarkers){pinMarkers[k].remove();delete pinMarkers[k];}pins.forEach(addPinMarker);}
function addPin(lng,lat,name){
  const p={id:String(Date.now()),lng:+(+lng).toFixed(5),lat:+(+lat).toFixed(5),name:name||(I18N[lang].pinname+" "+(pins.length+1))};
  pins.push(p);savePins();addPinMarker(p);selectPin(p);openPinPopup(p);
}
function selectPin(p){
  userLoc=[p.lng,p.lat];
  if(!revealed.size)revealAll();
  fitToNearby(userLoc,6);   // frame the pin + nearby stations
}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function openPinPopup(p){
  if(popup)popup.remove();
  const t=I18N[lang];
  popup=new maplibregl.Popup({offset:26,maxWidth:"230px"}).setLngLat([p.lng,p.lat])
    .setHTML(`<div class="pp ${lang==='th'?'lang-th':''}">
      <input class="pinname" value="${esc(p.name)}" aria-label="Pin name" onchange="window.__renamepin('${p.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()">
      <div class="ppth">${t.dragmove} · ${t.renamehint}</div>
      <button class="btn" style="margin-top:10px;height:32px" onclick="window.__rmpin('${p.id}')">${t.remove}</button></div>`).addTo(map);
  popup._f=null;
}
window.__rmpin=id=>{pins=pins.filter(x=>x.id!==id);savePins();if(pinMarkers[id]){pinMarkers[id].remove();delete pinMarkers[id];}if(popup)popup.remove();};
window.__renamepin=(id,val)=>{const p=pins.find(x=>x.id===id);if(p){const v=(val||"").trim();if(v)p.name=v;savePins();}};

document.getElementById("locateBtn").onclick=()=>{wantFit=true;geo.trigger();};
document.getElementById("pinBtn").onclick=()=>{pinMode=true;placeMode=false;map.getCanvas().style.cursor="crosshair";toast(I18N[lang].pinhint);};

// ── place search (geocoding) → drop a saved pin anywhere ───────────────
const si=document.getElementById("searchInput"), sr=document.getElementById("searchResults");
let searchTimer=null, searchSeq=0;
function srMsg(txt){sr.innerHTML=`<div class="sr muted${lang==='th'?' lang-th':''}">${txt}</div>`;sr.hidden=false;}
async function doSearch(q){
  if(!q||q.length<3){sr.hidden=true;return;}
  const seq=++searchSeq; srMsg(I18N[lang].searching);
  try{
    const url="https://nominatim.openstreetmap.org/search?"+new URLSearchParams({format:"jsonv2",q,limit:"6","accept-language":lang});
    const r=await fetch(url,{headers:{"Accept":"application/json"}});
    const arr=await r.json();
    if(seq!==searchSeq)return;
    if(!Array.isArray(arr)||!arr.length){srMsg(I18N[lang].searchno);return;}
    sr.innerHTML="";
    arr.forEach(x=>{
      const d=document.createElement("div");d.className="sr"+(lang==="th"?" lang-th":"");
      d.textContent=x.display_name;
      d.onclick=()=>{sr.hidden=true;si.value="";si.blur();addPin(+x.lon,+x.lat,(x.display_name||"").split(",")[0]);};
      sr.appendChild(d);
    });
    sr.hidden=false;
  }catch(e){ if(seq===searchSeq)srMsg(I18N[lang].searchno); }
}
si.addEventListener("input",()=>{clearTimeout(searchTimer);const q=si.value.trim();if(q.length<3){sr.hidden=true;return;}searchTimer=setTimeout(()=>doSearch(q),350);});
si.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();clearTimeout(searchTimer);doSearch(si.value.trim());}else if(e.key==="Escape"){sr.hidden=true;}});
document.addEventListener("click",e=>{if(!e.target.closest(".searchwrap"))sr.hidden=true;});
document.getElementById("allBtn").onclick=()=>withLive(()=>{revealAll();fitCity();});
document.getElementById("refreshBtn").onclick=()=>withLive(()=>{revealAll();toast(I18N[lang].updated+" "+fmtTime(updatedAt));});
document.getElementById("infoBtn").onclick=()=>document.getElementById("modal").hidden=false;
document.getElementById("modalClose").onclick=()=>document.getElementById("modal").hidden=true;
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")document.getElementById("modal").hidden=true;};

function applyLang(){
  const t=I18N[lang];
  document.querySelectorAll("[data-i]").forEach(el=>{let v=t[el.getAttribute("data-i")];if(v==null)return;el.textContent=v.replace("__WHEN__",fmtWhen());});
  document.querySelectorAll("[data-iph]").forEach(el=>{const v=t[el.getAttribute("data-iph")];if(v!=null)el.placeholder=v;});
  document.documentElement.lang=lang;document.body.classList.toggle("lang-th",lang==="th");
  document.getElementById("enBtn").setAttribute("aria-pressed",lang==="en");
  document.getElementById("thBtn").setAttribute("aria-pressed",lang==="th");
  renderLegend();renderNear();updateStamp();
  if(popup&&popup._f)popup.setHTML(popupHTML(popup._f));
}
document.getElementById("enBtn").onclick=()=>{lang="en";applyLang();};
document.getElementById("thBtn").onclick=()=>{lang="th";applyLang();};
applyLang();

// Keep an open tab fresh: re-pull the feed every 10 min (proxy handles the real caching).
setInterval(()=>{pullLive().then(()=>{revealAll();}).catch(()=>{});},10*60*1000);
</script>
